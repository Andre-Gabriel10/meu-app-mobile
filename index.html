<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App</title>
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 18px;            
  background-color: #f2f5fa;
  color: #1c2b44;

  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background-color: #1f4eb4;
  color: white;
}

h1 {
  margin: 0;
  font-size: 24px;
}

nav {
  display: flex;
  flex-direction: column;
  background-color: #17398a;
}

nav a {
  padding: 16px 20px;
  color: white;
  text-decoration: none;
  border-bottom: 1px solid #2f58b8;
}

.escondido {
  display: none;              
}

main {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 24px 20px;
  flex: 1;                    
}

input, button {
  width: 100%;                
  padding: 16px;              
  font-size: 18px;
  border-radius: 10px;
  border: 2px solid #b9c5dd;
}

button {
  background-color: #1f4eb4;
  color: white;
  border: none;
  font-weight: bold;
}

button.secundario {
  background-color: #e8b923;
  color: #1c2b44;
}

#mensagem {
  min-height: 24px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 14px;
  font-size: 14px;
  background-color: #dfe6f3;
}

@media (max-width: 480px) {
  body {
    font-size: 16px;
  }
  h1 {
    font-size: 20px;
  }
  footer {
    display: none;           
  }
}
  </style>
</head>
<body>

  <header>
    <h1>Meu App</h1>
    <button id="btnMenu" aria-label="Abrir menu">☰</button>
  </header>

  <nav id="menu" class="escondido">
    <a href="#">Início</a>
    <a href="#">Perfil</a>
    <a href="#">Ajuda</a>
  </nav>

  <main>
    <h2>Bem-vindo!</h2>
    <p>Entre com seu nome para continuar.</p>

    <input type="text" id="nome" placeholder="Digite seu nome">
    <button id="btnEntrar">Entrar</button>
    <p id="mensagem"></p>

    <button id="btnCor" class="secundario">Trocar cor do app</button>
    <button id="btnContar" class="secundario">Toques: 0</button>
  </main>

  <footer>
    <p>Feito por André Gabriel</p>
  </footer>

  <script>
const btnMenu = document.getElementById('btnMenu');
const menu = document.getElementById('menu');
const btnEntrar = document.getElementById('btnEntrar');
const campoNome = document.getElementById('nome');
const mensagem = document.getElementById('mensagem');
const btnCor = document.getElementById('btnCor');
const btnContar = document.getElementById('btnContar');

btnMenu.addEventListener('click', function () {
  menu.classList.toggle('escondido');
});

btnEntrar.addEventListener('click', function () {
  const nome = campoNome.value.trim();
  if (nome === '') {
    mensagem.textContent = 'Por favor, digite seu nome.';
    mensagem.style.color = 'red';
  } else {
    mensagem.textContent = 'Olá, ' + nome + '! Você entrou.';
    mensagem.style.color = 'green';
  }
});

const cores = ['#f2f5fa', '#ffe9ec', '#e6f7ea', '#fff6d6'];
let posicao = 0;
btnCor.addEventListener('click', function () {
  posicao = (posicao + 1) % cores.length;
  document.body.style.backgroundColor = cores[posicao];
});

let toques = 0;
btnContar.addEventListener('click', function () {
  toques++;
  btnContar.textContent = 'Toques: ' + toques;
});
  </script>
</body>
</html>
